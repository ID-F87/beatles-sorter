<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beatles 213 Song Sorter</title>
<style>
:root{--bg:#f3efe5;--ink:#181818;--muted:#6d695f;--card:#fffdf8;--line:#d8d0bf;--accent:#242424}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:980px;margin:auto;padding:24px 18px 60px}
header{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:18px}
h1{margin:0;font-size:clamp(25px,5vw,44px);letter-spacing:-.04em}.sub{color:var(--muted);font-size:13px}
.progress{height:9px;background:#ddd5c5;border-radius:99px;overflow:hidden;margin:12px 0 6px}.bar{height:100%;width:0;background:var(--accent);transition:.2s}
.stats{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.arena{display:grid;grid-template-columns:1fr 72px 1fr;gap:12px;align-items:stretch;margin-top:22px}
.choice{min-height:270px;border:1px solid var(--line);border-radius:18px;background:var(--card);padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;box-shadow:0 5px 18px #0000000c;transition:.12s}
.choice:hover{transform:translateY(-2px);border-color:#999}.choice:active{transform:scale(.99)}
.song{font-family:Georgia,serif;font-weight:700;font-size:clamp(25px,4vw,42px);line-height:1.08}.album{margin-top:16px;color:var(--muted);font-size:13px}.yt{margin-top:20px;font-size:13px;padding:9px 12px;background:#fff;border-radius:999px}
.vs{display:flex;align-items:center;justify-content:center;font-weight:800;color:#928b7c}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
button{border:1px solid var(--line);background:var(--card);padding:10px 14px;border-radius:10px;cursor:pointer;color:var(--ink)}
button:hover{border-color:#999}button:disabled{opacity:.4;cursor:not-allowed}
kbd{border:1px solid #bbb;border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:#fff;font-size:11px}
.note{text-align:center;color:var(--muted);font-size:12px;margin-top:12px}
#result{display:none}.result-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:25px 0 10px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
td{padding:11px 13px;border-bottom:1px solid #e8e1d4}.rank{width:65px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}.r-album{color:var(--muted);font-size:12px}
footer{margin-top:22px;color:var(--muted);font-size:11px;text-align:center}
@media(max-width:680px){.arena{grid-template-columns:1fr;}.vs{height:24px}.choice{min-height:190px}header{align-items:start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
<section id="sorter">
<header><div><h1>THE BEATLES<br>213 SONG SORTER</h1><div class="sub">Core catalogue + Past Masters / German recordings included / randomized pair order</div></div><div class="sub">選ぶだけ。対戦順は開始時にランダム化・途中経過は自動保存。試聴はYouTubeアプリ起動を狙います。</div></header>
<div class="progress"><div id="bar" class="bar"></div></div>
<div class="stats"><span id="count">比較 0</span><span id="pct">0%</span></div>
<div class="arena">
  <div id="left" class="choice" tabindex="0"><div id="lt" class="song"></div><div id="la" class="album"></div><button id="lyt" class="yt" type="button">▶ YouTubeアプリで聴く</button></div>
  <div class="vs">VS</div>
  <div id="right" class="choice" tabindex="0"><div id="rt" class="song"></div><div id="ra" class="album"></div><button id="ryt" class="yt" type="button">▶ YouTubeアプリで聴く</button></div>
</div>
<div class="controls">
<button id="tie">引き分け <kbd>↓</kbd></button>
<button id="undo">1つ戻る <kbd>Z</kbd></button>
<button id="shuffle">シャッフルして最初から</button><button id="reset">同じ順で最初から</button>
</div>
<div class="note"><kbd>←</kbd> 左　<kbd>→</kbd> 右　<kbd>↓</kbd> 引き分け　／ タップ・クリック可</div>
</section>

<section id="result">
<div class="result-head"><div><h1>RESULT</h1><div id="summary" class="sub"></div></div><div><button id="copy">結果をコピー</button> <button id="again">やり直す</button></div></div>
<table><tbody id="tbody"></tbody></table>
</section>
<footer>Personal Beatles ranking tool. No audio or artwork is included.</footer>
</div>

const KEY='beatles-sorter-213-v1';
let state=null;

function shuffledIndices(){
  const a=SONGS.map((_,i)=>i);
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function fresh(){
  const lists=shuffledIndices().map(i=>[i]);
  return {lists, next:[], a:0,b:0, out:[], comparisons:0, ties:[], history:[], randomized:true};
}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}

function snapshot(){
  state.history.push(JSON.stringify({...state,history:[]}));
  if(state.history.length>60)state.history.shift();
}
function currentPair(){
  while(state.lists.length>1 || state.next.length){
    if(state.lists.length<2){
      if(state.lists.length===1)state.next.push(state.lists.shift());
      state.lists=state.next; state.next=[]; state.a=0;state.b=0;state.out=[];
      continue;
    }
    return [state.lists[0][state.a],state.lists[1][state.b]];
  }
  return null;
}
function finishMerge(){
  const L=state.lists[0],R=state.lists[1];
  while(state.a<L.length)state.out.push(L[state.a++]);
  while(state.b<R.length)state.out.push(R[state.b++]);
  state.next.push(state.out);
  state.lists.splice(0,2); state.a=0;state.b=0;state.out=[];
}
function choose(side){
  const pair=currentPair(); if(!pair)return render();
  snapshot();
  const L=state.lists[0],R=state.lists[1];
  if(side==='L')state.out.push(L[state.a++]);
  if(side==='R')state.out.push(R[state.b++]);
  if(side==='T'){
    // Preserve an actual shared rank by storing the adjacent pair.
    state.out.push(L[state.a++],R[state.b++]);
    state.ties.push([pair[0],pair[1]]);
  }
  state.comparisons++;
  if(state.a>=L.length || state.b>=R.length)finishMerge();
  save();render();
}
function estimatedPct(){
  // Merge-sort comparison count varies; n*ceil(log2 n) is a stable progress denominator.
  const max=SONGS.length*Math.ceil(Math.log2(SONGS.length));
  return Math.min(99,Math.floor(state.comparisons/max*100));
}
function render(){
  const pair=currentPair();
  if(!pair){
    let ranking = state.lists[0] || state.next[0] || state.out;
    if(ranking && ranking.length===SONGS.length){showResult(ranking);return}
    // final singleton normalization
    if(state.lists.length===1 && state.lists[0].length===SONGS.length){showResult(state.lists[0]);return}
  }
  document.getElementById('sorter').style.display='';
  document.getElementById('result').style.display='none';
  const [l,r]=currentPair();
  document.getElementById('lt').textContent=SONGS[l].title;
  document.getElementById('la').textContent=SONGS[l].album;
  document.getElementById('rt').textContent=SONGS[r].title;
  document.getElementById('ra').textContent=SONGS[r].album;
  const p=estimatedPct();document.getElementById('bar').style.width=p+'%';
  document.getElementById('pct').textContent=p+'%';
  document.getElementById('count').textContent='比較 '+state.comparisons;
  document.getElementById('undo').disabled=!state.history.length;
}
function tieGroups(ranking){
  // Union-find over explicit tie decisions; transitive ties share rank.
  const p=ranking.map((_,i)=>i), pos=new Map(ranking.map((x,i)=>[x,i]));
  const find=x=>p[x]===x?x:(p[x]=find(p[x]));
  const uni=(a,b)=>{a=find(a);b=find(b);if(a!==b)p[b]=a};
  for(const [a,b] of state.ties){if(pos.has(a)&&pos.has(b))uni(pos.get(a),pos.get(b))}
  return {find};
}
function showResult(ranking){
  document.getElementById('sorter').style.display='none';
  document.getElementById('result').style.display='';
  document.getElementById('summary').textContent=`${SONGS.length}曲 / ${state.comparisons}比較`;
  const tb=document.getElementById('tbody');tb.innerHTML='';
  const {find}=tieGroups(ranking); let displayRank=1;
  for(let i=0;i<ranking.length;i++){
    if(i>0 && find(i)!==find(i-1))displayRank=i+1;
    const s=SONGS[ranking[i]],tr=document.createElement('tr');
    tr.innerHTML=`<td class="rank">${displayRank}</td><td><strong></strong><div class="r-album"></div></td>`;
    tr.querySelector('strong').textContent=s.title;tr.querySelector('.r-album').textContent=s.album;tb.appendChild(tr);
  }
  document.getElementById('bar').style.width='100%'; save();
}
function reset(){restartSameOrder()}

function restartSameOrder(){
  if(!confirm('同じ初期順のまま最初からやり直しますか？'))return;
  // Recover the original leaf order from the current saved state if possible.
  const flat=[];
  const collect=x=>{ if(Array.isArray(x)){ for(const y of x) collect(y); } else if(Number.isInteger(x)) flat.push(x); };
  collect(state.lists); collect(state.next); collect(state.out);
  const seen=new Set(flat);
  for(let i=0;i<SONGS.length;i++) if(!seen.has(i)) flat.push(i);
  const order=flat.slice(0,SONGS.length);
  state={lists:order.map(i=>[i]),next:[],a:0,b:0,out:[],comparisons:0,ties:[],history:[],randomized:true};
  save(); render();
}
function reshuffle(){
  if(!confirm('対戦順をシャッフルして最初からやり直しますか？'))return;
  localStorage.removeItem(KEY);
  state=fresh(); save(); render();
}

function openYouTube(songIndex){
  const q=encodeURIComponent('The Beatles '+SONGS[songIndex].title+' official audio');
  window.open('https://www.youtube.com/results?search_query='+q,'_blank');
}

document.getElementById('right').onclick=()=>choose('R');
document.getElementById('lyt').onclick=(e)=>{e.stopPropagation();const p=currentPair();if(p)openYouTube(p[0])};
document.getElementById('ryt').onclick=(e)=>{e.stopPropagation();const p=currentPair();if(p)openYouTube(p[1])};
document.getElementById('tie').onclick=()=>choose('T');
document.getElementById('undo').onclick=()=>{if(!state.history.length)return;const h=state.history.pop();const hist=state.history;state=JSON.parse(h);state.history=hist;save();render()};
document.getElementById('reset').onclick=reset;document.getElementById('shuffle').onclick=reshuffle;document.getElementById('again').onclick=reshuffle;

};
